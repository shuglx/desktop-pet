name: 构建桌宠发布包

# 触发条件：
#  - 仅推送 deepseek-doll-v* / yueyue-v* / cyberpunk-lucy-v* 标签才构建：
#    按 tag 前缀只构建对应桌宠，并自动创建 GitHub Release 附带安装包（多桌宠共用本仓库，靠 tag 前缀区分）
#  - 手动触发：Action 页面点 “Run workflow”（构建全部桌宠，仅存构件不发 Release）
#  注意：推送 master 不触发构建
#
# 实现说明：不用 matrix.project + include 的写法——不匹配的 include 条目会被
# GitHub Actions 追加为新组合，导致"只想构建 A 却也构建了 B"。改为在 resolve
# job 里生成完整组合数组，build job 用 matrix.include: fromJson() 整体注入。
on:
  push:
    tags: ['deepseek-doll-v*', 'yueyue-v*', 'cyberpunk-lucy-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 根据触发来源生成构建矩阵：tag → 只生成前缀对应的组合；手动 → 全部
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -eu
          # 三平台组合：win x64 便携版 / linux arm64 deb / mac x64 DMG
          win='"os":"windows-latest","build":"--win portable --x64","ext":"exe"'
          linux='"os":"ubuntu-latest","build":"--linux deb --arm64","ext":"deb"'
          mac='"os":"macos-15-intel","build":"--mac dmg --x64","ext":"dmg"'
          rows() { # $1=project → 输出该桌宠三平台组合（逗号分隔）
            p="$1"
            printf '{"project":"%s","name":"win-x64",%s},{"project":"%s","name":"linux-arm64",%s},{"project":"%s","name":"mac-x64",%s}' \
              "$p" "$win" "$p" "$linux" "$p" "$mac"
          }
          if [[ "$GITHUB_REF" == refs/tags/deepseek-doll-v* ]]; then
            matrix="[$(rows deepseek-doll)]"
          elif [[ "$GITHUB_REF" == refs/tags/yueyue-v* ]]; then
            matrix="[$(rows yueyue)]"
          elif [[ "$GITHUB_REF" == refs/tags/cyberpunk-lucy-v* ]]; then
            matrix="[$(rows cyberpunk-lucy)]"
          else
            matrix="[$(rows deepseek-doll),$(rows yueyue),$(rows cyberpunk-lucy)]"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "resolved matrix: $matrix"

  build:
    name: ${{ matrix.project }}/${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 打包 ${{ matrix.project }} ${{ matrix.name }}
        run: npx electron-builder ${{ matrix.build }}

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.name }}
          path: ${{ matrix.project }}/dist/*.${{ matrix.ext }}

  # 打 deepseek-doll-v* / yueyue-v* 标签时：把对应桌宠三平台的包发布为 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/deepseek-doll-v') || startsWith(github.ref, 'refs/tags/yueyue-v') || startsWith(github.ref, 'refs/tags/cyberpunk-lucy-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes 需要 git 历史来生成更新日志，必须有代码 checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 幂等：tag 重推/重跑时先删掉旧 release（保留 tag），避免残留错误产物
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
