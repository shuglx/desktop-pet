name: 构建桌宠发布包

# 触发条件：
#  - 仅推送 deepseek-doll-v* / yueyue-v* 标签才构建：按 tag 前缀只构建对应桌宠，
#    并自动创建 GitHub Release 附带安装包（多桌宠共用本仓库，靠 tag 前缀区分）
#  - 手动触发：Action 页面点 “Run workflow”（构建全部桌宠，仅存构件不发 Release）
#  注意：推送 master 不触发构建
on:
  push:
    tags: ['deepseek-doll-v*', 'yueyue-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 根据触发来源决定构建哪些项目：tag → 只构建前缀对应的；分支/手动 → 全部
  resolve:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set.outputs.projects }}
    steps:
      - id: set
        run: |
          if [[ "$GITHUB_REF" == refs/tags/deepseek-doll-v* ]]; then
            echo 'projects=["deepseek-doll"]' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/yueyue-v* ]]; then
            echo 'projects=["yueyue"]' >> "$GITHUB_OUTPUT"
          else
            echo 'projects=["deepseek-doll","yueyue"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.project }}/${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.resolve.outputs.projects) }}
        include:
          # Windows x64 便携版（单文件 exe，可直接运行）—— Windows 官方 runner 原生构建
          - { project: deepseek-doll, os: windows-latest, name: win-x64,     build: '--win portable --x64',  ext: exe }
          # Linux arm64 deb 安装包 —— Linux 上交叉构建（electron 提供预编译 arm64 二进制）
          - { project: deepseek-doll, os: ubuntu-latest,  name: linux-arm64, build: '--linux deb --arm64',   ext: deb }
          # macOS Intel(x64) DMG 安装包 —— macOS 15 Intel runner（macos-13 已被 GitHub 停用）
          - { project: deepseek-doll, os: macos-15-intel, name: mac-x64,     build: '--mac dmg --x64',       ext: dmg }
          - { project: yueyue,        os: windows-latest, name: win-x64,     build: '--win portable --x64',  ext: exe }
          - { project: yueyue,        os: ubuntu-latest,  name: linux-arm64, build: '--linux deb --arm64',   ext: deb }
          - { project: yueyue,        os: macos-15-intel, name: mac-x64,     build: '--mac dmg --x64',       ext: dmg }
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 打包 ${{ matrix.project }} ${{ matrix.name }}
        run: npx electron-builder ${{ matrix.build }}

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.name }}
          path: ${{ matrix.project }}/dist/*.${{ matrix.ext }}

  # 打 deepseek-doll-v* / yueyue-v* 标签时：把对应桌宠三平台的包发布为 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/deepseek-doll-v') || startsWith(github.ref, 'refs/tags/yueyue-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes 需要 git 历史来生成更新日志，必须有代码 checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
